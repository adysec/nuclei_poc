id: magicmirror
info:
  name: magicmirror
  author: cn-kali-team
  tags: detect,tech,magicmirror
  severity: info
  metadata:
    product: magicmirror
    shodan-query:
    - http.title:"magicmirror"
    vendor: magicmirrororg
    verified: true
http:
- method: GET
  path:
  - '{{BaseURL}}/'
  matchers:
  - type: regex
    regex:
    - (?mi)<title[^>]*>magicmirror.*?</title>
