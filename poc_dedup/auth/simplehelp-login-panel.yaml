id: simplehelp-login-panel
info:
  name: SimpleHelp - Login Panel
  author: rxerium
  severity: info
  description: |
    SimpleHelp remote support and management login panel was detected.
  reference:
    - https://simple-help.com/
  metadata:
    runzero-match: any(each(service["html.titles"]), {# matches "^Welcome to SimpleHelp$"})
    max-request: 1
    shodan-query: http.title:"Welcome to SimpleHelp"
    verified: true
  tags: detect,login,panel,simplehelp
http:
  - method: GET
    path:
      - "{{BaseURL}}/welcome"
    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '<title>Welcome to SimpleHelp</title>'
      - type: status
        status:
          - 200
