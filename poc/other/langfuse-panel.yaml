id: langfuse-panel
info:
  name: Langfuse Panel - Detect
  author: ChrisJr404,infosec-asish
  severity: info
  description: |
    Langfuse panel was detected. Langfuse is an open-source LLM engineering platform for observability, evaluations, prompt management and analytics. Exposed instances may reveal LLM prompts, traces, evaluations, and connected API keys.
  reference:
    - https://github.com/langfuse/langfuse
    - https://langfuse.com/
  metadata:
    runzero-match: any(each(service["html.titles"]), {# matches "(?i)Langfuse"})
    fofa-query: title="Langfuse"
    max-request: 2
    product: langfuse
    shodan-query: http.title:"Langfuse"
    vendor: langfuse
    verified: true
  tags: ai,detect,langfuse,llm,login,panel
http:
  - host-redirects: true
    matchers:
      - condition: or
        # digest: 4a0a00473045022100ae524554b41c2c4b75bf920a5294245e4a88ee5845b84db5e0beb1de35b11e1f02206a9193a8467ca96fdc2699cf4f94da87eb0ae3aa6fa2be60db418f0366afdf84:922c64590222798bb761d5b6d8e72950

        dsl:
          - status_code == 200 && contains(to_lower(body), "<title>langfuse")
          - status_code == 200 && contains(to_lower(header), "x-langfuse-")
          - status_code == 200 && contains_all(body, "\"status\":\"OK\"", "\"version\"") && contains(to_lower(header), "application/json")
        type: dsl
    max-redirects: 2
    method: GET
    path:
      - '{{BaseURL}}'
      - '{{BaseURL}}/api/public/health'
    stop-at-first-match: true
